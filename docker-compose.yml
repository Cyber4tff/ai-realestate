version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quantflow_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: quantflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quantflow_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: quantflow_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword123@db:5432/quantflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretjwttokenkeyforlocaldevelopment1234567890!
      - WEBHOOK_SECRET=quantflow_webhook_secret_key_123
      - ENCRYPTION_KEY=L7Gj2Z1h9z3-b9F1s5D8K0J2e3f4g5h6i7j8k9l0m1o=
      - GEMINI_API_KEY=
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
    container_name: quantflow_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword123@db:5432/quantflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretjwttokenkeyforlocaldevelopment1234567890!
      - WEBHOOK_SECRET=quantflow_webhook_secret_key_123
      - ENCRYPTION_KEY=L7Gj2Z1h9z3-b9F1s5D8K0J2e3f4g5h6i7j8k9l0m1o=
      - GEMINI_API_KEY=
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: quantflow_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

volumes:
  postgres_data:
